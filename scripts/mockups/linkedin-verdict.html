<!doctype html>
<!--
  The first image of The Missing Test Suite's LinkedIn repost: who gives the
  verdict. Code gets one from its tests on every attempt; a reply to a
  customer has no test suite and gets one only when an expert reads it.

  Render to PNG with:  npm run mockup:png  (light only, 1080×1350, 4:5)
  The icons are the ones in src/remotion/shared.tsx (Agent, Evals, Experts)
  and the colors those of src/components/loop-animation.css, so the image
  matches the post's figures. Short labels only; the post's text explains.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkedIn: who gives the verdict</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #verdict { width: 360px; height: 450px; background: #ffffff; }
  svg { display: block; }
  text { font-family: inherit; }
</style>
</head>
<body>
<div id="verdict">
<svg viewBox="0 0 360 450" width="360" height="450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a9d8f"/>
    </marker>
    <!-- Person and Expert, as in shared.tsx -->
    <g id="person">
      <circle cx="0" cy="-8" r="8" fill="#1f2937"/>
      <path d="M-14,16 C-14,4 -7,1 0,1 C7,1 14,4 14,16 Z" fill="#1f2937"/>
    </g>
    <g id="expert">
      <use href="#person"/>
      <circle cx="13" cy="-12" r="8" fill="#2a9d8f" stroke="#ffffff" stroke-width="2"/>
      <path d="M9.5,-12 l2.5,2.5 l4.5,-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Code: the coding agent and the verdict it gets on every attempt -->
  <text x="24" y="44" font-size="17" font-weight="700" fill="#1f2937">Code</text>

  <g transform="translate(100 118) scale(1.6)">
    <rect x="-26" y="-20" width="52" height="40" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="-26" x2="26" y1="-11" y2="-11" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M-19,-3 l5,4 l-5,4" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-8" x2="17.2" y1="-3" y2="-3" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" x2="8.8" y1="3" y2="3" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8" x2="13" y1="9" y2="9" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="100" y="168" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Coding agent</text>

  <g transform="translate(262 118) scale(1.6)">
    <rect x="-16" y="-19" width="32" height="38" rx="4" fill="#f8fafc" stroke="#1f2937" stroke-width="2.5"/>
    <path d="M-10,-9 l2.5,2.5 l4,-5" fill="none" stroke="#2a9d8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" x2="10" y1="-9" y2="-9" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-10,0 l2.5,2.5 l4,-5" fill="none" stroke="#2a9d8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" x2="10" y1="0" y2="0" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-10,9 l2.5,2.5 l4,-5" fill="none" stroke="#2a9d8f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" x2="10" y1="9" y2="9" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="262" y="168" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Tests, linters</text>

  <!-- The loop: attempt out, verdict back -->
  <path d="M146,100 C175,76 205,76 230,96" fill="none" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrow-ok)"/>
  <path d="M230,140 C205,160 175,160 146,136" fill="none" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrow-ok)"/>

  <rect x="72" y="182" width="216" height="28" rx="14" fill="#2a9d8f"/>
  <text x="180" y="200.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Verdict on every attempt</text>

  <line x1="24" x2="336" y1="234" y2="234" stroke="#cbd5e1" stroke-width="1"/>

  <!-- A reply to a customer: no test suite, only the experts -->
  <text x="24" y="270" font-size="17" font-weight="700" fill="#1f2937">Reply to a customer</text>

  <g transform="translate(74 336)">
    <rect x="-46" y="-30" width="92" height="60" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <line x1="-26" y1="0" x2="0" y2="-13" stroke="#64748b" stroke-width="1.5"/>
    <line x1="-26" y1="0" x2="0" y2="13" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="-13" x2="26" y2="-20" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="-13" x2="26" y2="-6" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="13" x2="26" y2="6" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="13" x2="26" y2="20" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="-26" cy="0" r="5" fill="#64748b"/>
    <circle cx="0" cy="-13" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="13" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="-20" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="-6" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="6" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="26" cy="20" r="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="74" y="390" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Support agent</text>

  <!-- Where the test suite would be -->
  <rect x="152" y="310" width="56" height="52" rx="8" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="180" y="344" font-size="22" font-weight="700" fill="#6b7280" text-anchor="middle">?</text>
  <text x="180" y="390" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle">No test suite</text>

  <line x1="122" y1="336" x2="148" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="212" y1="336" x2="242" y2="336" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(290 336) scale(1.35)">
    <use href="#person" transform="translate(-16 -7) scale(0.8)"/>
    <use href="#person" transform="translate(16 -7) scale(0.8)"/>
    <use href="#expert" transform="translate(0 5)"/>
  </g>
  <text x="290" y="390" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">Experts</text>

  <rect x="54" y="406" width="252" height="28" rx="14" fill="#e9a23b"/>
  <text x="180" y="424.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Verdict when an expert reads it</text>
</svg>
</div>
</body>
</html>
