cv:
  name: Daniel Fridljand
  photo: ../../images/fridljand_daniel.jpg
  website: https://danielfridljand.de
  email: daniel.fridljand@gmail.com
  social_networks:
    - network: LinkedIn
      username: daniel-fridljand
    - network: GitHub
      username: FridljDa
  sections:
    summary:
      - "AI engineer building production systems in Python and Rust, with a mathematician's rigor about whether they work. My proudest work to date: an LLM-based customer-support system I took from discovery to live production as the sole AI engineer, drafting resolutions for 800+ B2C tickets in its first three months at ~87% reviewer approval."
    industry_experience:
      - company: TNG Technology Consulting
        position: AI Engineer - Software Consultant
        location: Munich, Germany
        start_date: 2025-12
        end_date: present
        summary: "Building AI and predictive-analytics systems for clients and for TNG, from discovery through live operation."
        highlights:
          - "Architected a cinema-ticketing support system as a hybrid: deterministic paths for the recurring-intent majority, agentic fallback for the long tail, every draft reviewed by staff before customer contact."
          - "Built a feedback-driven improvement loop: reviewer corrections became shipped code changes, each gated against a growing Langfuse evaluation suite, on Temporal workflows that pause for staff sign-off."
          - "Sole engineer on a scrap-prediction proof of concept for a manufacturer: across ~40 benchmarked models, order attributes fixed at booking matched the full sensor set, steering the client toward tracking raw-material batches."
          - "One of three developers on an internal sandboxed platform (Tauri/React, Rust) for agentic workflows on sensitive local files; it cleared a 15-person adversarial red-team, unlocking expansion beyond the pilot."
          - "Scaled a retailer's cashier-fraud anomaly scoring from a 7-store sample to its full estate via SQL Server aggregation."
      - company: TNG Technology Consulting
        position: Platform Engineer - Software Consultant
        location: Munich, Germany
        start_date: 2024-12
        end_date: 2025-12
        summary: "Platform engineer on a multi-team program modernizing a global supply-chain application from Java 8 to 17."
        highlights:
          - "Deployed a JFrog Artifactory proxy in three days after the work had been repeatedly postponed as too costly, cutting a recurring CI step from eight hours to 30 seconds — saving each developer ~1–2 hours a week."
          - "Added OWASP dependency scanning to the Jenkins pipeline and built Grafana dashboards over Prometheus metrics, giving stakeholders visibility of CVE reduction throughout the migration."
    research_experience:
      - company: Stanford University School of Medicine
        position: Research Data Analyst - Environmental Epidemiology
        location: Palo Alto, USA
        start_date: 2023-07
        end_date: 2023-12
        summary: "Statistical analysis and data tooling for a national study of air pollution and mortality inequality."
        highlights:
          - "Led the statistical analysis as co-first author of a [*Nature Medicine* paper](https://www.nature.com/articles/s41591-024-03117-0) (2024), which found that over half the Black–White age-adjusted mortality gap in the US is attributable to fine-particulate air pollution."
          - "Built a reproducible pipeline integrating 63M+ death records with pollution estimates and demographic data; open-sourced the analysis code and interactive R Shiny explorer."
      - company: European Molecular Biology Laboratory (EMBL)
        position: Research Data Analyst - Statistical Genomics (Master's Thesis)
        location: Heidelberg, Germany
        start_date: 2021-10
        end_date: 2022-05
        summary: "Research on multiple-testing methods for large-scale genomics."
        highlights:
          - "Developed IHW-Forest, a random-forest hypothesis-weighting method with its splitting and weighting logic written in C++ via Rcpp — it recovered over 30% more discoveries than standard corrections."
    education:
      - institution: University of Heidelberg
        area: Mathematics
        degree: M.Sc.
        location: Heidelberg, Germany
        start_date: 2020-10
        end_date: 2023-05
        highlights:
          - "Grade: 1.0. Exchange studies at Yale and Hebrew University of Jerusalem."
    skills:
      - label: Stack
        details: "Python (scikit-learn, PydanticAI), Rust, TypeScript/React, Java, SQL, R, C++"
      - label: Systems and delivery
        details: "Temporal, Langfuse, Kubernetes, Jenkins, Grafana/Prometheus"
design:
  theme: sb2nov
  page:
    size: us-letter
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: false
    show_top_note: true
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 79, 144)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family: New Computer Modern
    font_size:
      body: 10pt
      name: 30pt
    bold:
      name: true
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 2.5cm
    space_below_name: 0.3cm
    space_below_connections: 0.3cm
    connections:
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ''
      space_between_connections: 0.5cm
      hyperlink: true
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.3cm
    space_below: 0.1cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 1.2em
  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: false
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: ◦
      nested_bullet: '-'
      space_left: 0.2cm
      space_above: 0.15cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.5em
  templates:
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**
        *DEGREE in AREA*
        SUMMARY
        HIGHLIGHTS
      degree_column: ''
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    experience_entry:
      main_column: |-
        **POSITION**
        *COMPANY*
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        *LOCATION*
        *DATE*
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE
locale:
  language: english
settings:
  current_date: '2026-10-02'
